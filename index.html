<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sri Square Accounts</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#000;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:720px;margin:auto;padding:18px 22px 50px}
h1{font-size:34px;margin:4px 0 20px} h2{font-size:22px;margin:28px 0 12px}
.card{border:1px solid #333;border-radius:14px;padding:16px;margin:12px 0;background:#090909}
label{display:block;font-size:14px;color:#aaa;margin:10px 0 5px}
input,select,button{width:100%;font-size:18px;padding:12px;border-radius:9px;border:1px solid #555;background:#151515;color:#fff}
button{background:#eee;color:#000;border:0;font-weight:700;margin-top:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:18px}
.line input{max-width:210px;text-align:right}.total{font-size:24px;font-weight:800;border-top:1px solid #444;margin-top:8px;padding-top:12px}
.small{font-size:13px;color:#999}.danger{background:#333;color:#fff}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav button{margin:0}
.hidden{display:none}.bookingTitle{font-size:30px;font-weight:800;margin:8px 0 20px}
.search{margin-bottom:15px}
.item{padding:12px;border-bottom:1px solid #333;cursor:pointer}.item:last-child{border-bottom:0}
@media(max-width:500px){.wrap{padding:15px}.line{font-size:17px}.line input{max-width:150px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>SRI SQUARE ACCOUNTS</h1>
  <div class="nav">
    <button onclick="show('booking')">＋ New Booking</button>
    <button onclick="show('accounts')">📒 Accounts</button>
  </div>

  <section id="booking" class="card">
    <h2>New Booking</h2>
    <div class="row">
      <div><label>Booking / Serial No.</label><input id="bno" placeholder="SS052"></div>
      <div><label>Event Date</label><input id="date" type="date"></div>
    </div>
    <label>Event Type</label><input id="event" placeholder="Marriage / Reception / Engagement">
    <label>Customer Name</label><input id="name" placeholder="Name">
    <label>Phone Number</label><input id="phone" inputmode="tel" placeholder="Phone number">
    <div class="row">
      <div><label>Total Booking Amount</label><input id="bookTotal" type="number" inputmode="decimal" value="0"></div>
      <div><label>Advance Received</label><input id="advance" type="number" inputmode="decimal" value="0"></div>
    </div>
    <label>Notes</label><input id="notes" placeholder="Optional">
    <button onclick="saveBooking()">Save Booking</button>
    <div id="bookingMsg" class="small"></div>
  </section>

  <section id="accounts" class="card hidden">
    <h2>Account</h2>
    <label>Enter / Select Booking No.</label>
    <input id="lookup" class="search" placeholder="SS052" oninput="loadBooking(this.value)">
    <div id="accountArea" class="hidden">
      <div id="title" class="bookingTitle"></div>
      <div class="small" id="customerInfo"></div>

      <h2>INCOME / COLLECTION</h2>
      <div class="line"><span>Rent total</span><input id="rent" type="number" value="0"></div>
      <div class="line"><span>Advance (-)</span><input id="adv" type="number" value="0"></div>
      <div class="line"><span>Rent bal.</span><strong id="rentBal">0</strong></div>
      <div class="line"><span>Water</span><input id="water" type="number" value="0"></div>
      <div class="line"><span>Power Units</span><input id="units" type="number" value="0"></div>
      <div class="line"><span>Power Rate</span><input id="rate" type="number" value="18"></div>
      <div class="line"><span>Power Amount</span><strong id="power">0</strong></div>
      <div class="line"><span>Decoration</span><input id="deco" type="number" value="0"></div>
      <div class="line"><span>Lighting</span><input id="light" type="number" value="0"></div>
      <div class="line total"><span>Total</span><span id="incomeTotal">0</span></div>

      <h2>EXPENSES</h2>
      <div id="expenses"></div>
      <button class="danger" onclick="addExpense()">＋ Add Expense</button>
      <div class="line total"><span>EXP Total</span><span id="expTotal">0</span></div>

      <div class="line total"><span>Total - Exp</span><span id="beforeFinal">0</span></div>
      <div class="line total"><span>Total Bal</span><span id="finalBal">0</span></div>

      <button onclick="saveAccount()">Save Account</button>
      <button class="danger" onclick="printAccount()">Print / Save PDF</button>
      <button onclick="shareReport()">📤 Share Report</button>
    </div>
  </section>
</div>

<script>
const KEY='sriSquareBookings';
let currentNo='';
let data=JSON.parse(localStorage.getItem(KEY)||'{}');

function show(id){document.getElementById('booking').classList.toggle('hidden',id!=='booking');document.getElementById('accounts').classList.toggle('hidden',id!=='accounts');}
function money(n){return Math.round(Number(n)||0).toLocaleString('en-IN')}
function saveBooking(){
 const no=bno.value.trim(); if(!no){alert('Enter Booking / Serial No.');return}
 data[no]=data[no]||{account:{expenses:[]}};
 data[no].booking={date:date.value,event:event.value,name:name.value,phone:phone.value,total:+bookTotal.value||0,advance:+advance.value||0,notes:notes.value};
 localStorage.setItem(KEY,JSON.stringify(data)); bookingMsg.textContent='Saved '+no; lookup.value=no; loadBooking(no); show('accounts');
}
function loadBooking(no){
 no=no.trim(); if(!data[no]){accountArea.classList.add('hidden');return}
 currentNo=no; const b=data[no].booking||{};
 accountArea.classList.remove('hidden'); title.textContent=(b.date?new Date(b.date+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short'}):'')+' Event : '+no;
 customerInfo.textContent=[b.event,b.name,b.phone].filter(Boolean).join(' • ');
 const a=data[no].account||{};
 rent.value=a.rent||b.total||0; adv.value=(a.adv??b.advance)||0; water.value=a.water||0; units.value=a.units||0; rate.value=a.rate??18; deco.value=a.deco||0; light.value=a.light||0;
 expenses.innerHTML=''; (a.expenses||[]).forEach(e=>addExpense(e.name,e.amount)); if(!a.expenses?.length)addExpense('Electrician night kuli',0),addExpense('Bathroom cleaner',0);
 calc();
}
function addExpense(n='',v=0){const d=document.createElement('div');d.className='row';d.innerHTML='<input class="exname" placeholder="Expense name" value="'+n.replaceAll('"','&quot;')+'"><input class="examt" type="number" inputmode="decimal" value="'+v+'">';expenses.appendChild(d);d.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));}
document.addEventListener('input',e=>{if(['rent','adv','water','units','rate','deco','light'].includes(e.target.id))calc()});
function calc(){
 const r=+rent.value||0,a=+adv.value||0,w=+water.value||0,u=+units.value||0,rt=+rate.value||0,d=+deco.value||0,l=+light.value||0;
 const p=u*rt, rb=r-a, total=rb+w+p+d+l;
 let ex=0; document.querySelectorAll('.examt').forEach(x=>ex+=+x.value||0);
 rentBal.textContent=money(rb);power.textContent=money(p);incomeTotal.textContent=money(total);expTotal.textContent=money(ex);beforeFinal.textContent=money(total-ex);finalBal.textContent=money(total-ex);
}
function saveAccount(){
 if(!currentNo)return; const ex=[]; document.querySelectorAll('#expenses .row').forEach(row=>{ex.push({name:row.querySelector('.exname').value,amount:+row.querySelector('.examt').value||0})});
 data[currentNo].account={rent:+rent.value||0,adv:+adv.value||0,water:+water.value||0,units:+units.value||0,rate:+rate.value||0,deco:+deco.value||0,light:+light.value||0,expenses:ex};
 localStorage.setItem(KEY,JSON.stringify(data)); alert('Account saved for '+currentNo);
}
function buildReport(){
 const b=data[currentNo]?.booking||{};
 const r=+rent.value||0,a=+adv.value||0,w=+water.value||0,u=+units.value||0,rt=+rate.value||0,d=+deco.value||0,l=+light.value||0;
 const p=u*rt, rb=r-a, total=rb+w+p+d+l;
 const rows=[]; document.querySelectorAll('#expenses .row').forEach(row=>{const n=row.querySelector('.exname').value.trim(),v=+row.querySelector('.examt').value||0;if(n||v)rows.push(`${n||'Expense'} : ₹${money(v)}`)});
 const ex=rows.reduce((sum,_,i)=>sum+(+document.querySelectorAll('.examt')[i]?.value||0),0);
 return `SRI SQUARE ACCOUNTS\n\n${b.date?new Date(b.date+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):''} Event : ${currentNo}\n${[b.event,b.name,b.phone].filter(Boolean).join(' • ')}\n\nINCOME / COLLECTION\nRent total : ₹${money(r)}\nAdvance (-) : ₹${money(a)}\nRent bal. : ₹${money(rb)}\nWater : ₹${money(w)}\nPower Units : ${money(u)} × ₹${money(rt)} = ₹${money(p)}\nDecoration : ₹${money(d)}\nLighting : ₹${money(l)}\nTotal = ₹${money(total)}\n\nEXPENSES\n${rows.length?rows.join('\n'):'No expenses'}\nEXP Total = ₹${money(ex)}\n\nTotal - Exp = ₹${money(total)} - ₹${money(ex)}\nTotal Bal = ₹${money(total-ex)}`;
}
async function shareReport(){
 if(!currentNo){alert('Open an account first.');return}
 const text=buildReport();
 if(navigator.share){
   try{await navigator.share({title:'Sri Square Account - '+currentNo,text});}catch(e){if(e.name!=='AbortError') console.error(e)}
 }else if(navigator.clipboard){
   await navigator.clipboard.writeText(text); alert('Report copied. You can paste it into WhatsApp or any app.');
 }else{alert(text)}
}
function printAccount(){window.print()}
</script>
</body>
</html>
