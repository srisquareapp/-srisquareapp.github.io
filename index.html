<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json">
<title>Sri Square Accounts</title>
<style>
body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111;color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:2}h1{margin:0;font-size:25px}
main{max-width:650px;margin:auto;padding:14px 14px 90px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #0001}
h2{font-size:19px;margin:4px 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:#666;display:block;margin:10px 0 5px}
input,button{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}
button{background:#111;color:white;border:0;font-weight:700;margin-top:10px}.secondary{background:#e9e9ed;color:#111}
.row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0;gap:10px}.row input{max-width:150px;text-align:right}.total{font-weight:800;font-size:18px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nav button{margin:0}.hidden{display:none}.item{padding:12px 0;border-bottom:1px solid #eee}.muted{color:#666;font-size:13px}
</style></head><body>
<header><h1>SRI SQUARE ACCOUNTS</h1></header><main>
<div class="nav"><button onclick="tab('bookings')">Bookings</button><button onclick="tab('accounts')">Accounts</button><button onclick="tab('reports')">Reports</button></div>

<section id="bookings"><div class="card"><h2>New Booking</h2>
<div class="grid"><div><label>Booking / Serial No.</label><input id="no" placeholder="SS052"></div><div><label>Event Date</label><input id="date" type="date"></div></div>
<label>Event Type</label><input id="event" placeholder="Marriage / Reception / Engagement">
<label>Customer Name</label><input id="name" placeholder="Name"><label>Phone Number</label><input id="phone" type="tel" placeholder="Phone number">
<div class="grid"><div><label>Total Booking Amount</label><input id="bt" type="number" value="0"></div><div><label>Advance Received</label><input id="ba" type="number" value="0"></div></div>
<label>Notes</label><input id="notes" placeholder="Optional"><button onclick="saveBooking()">Save Booking</button></div>
<div class="card"><h2>Saved Bookings</h2><input placeholder="Search booking / name / phone" oninput="renderBookings(this.value)"><div id="list"></div></div></section>

<section id="accounts" class="hidden"><div class="card"><h2>Open Account</h2><input id="find" placeholder="Enter booking number e.g. SS052" oninput="openAccount(this.value)"><div id="acct"></div></div></section>

<section id="reports" class="hidden"><div class="card"><h2>Reports</h2><div id="report"></div></div></section>
</main>
<script>
let db=JSON.parse(localStorage.getItem('ssdb')||'{}'), cur='';
const $=id=>document.getElementById(id), save=()=>localStorage.setItem('ssdb',JSON.stringify(db)), n=v=>Number(v)||0, money=v=>'₹'+Math.round(v).toLocaleString('en-IN');
function tab(x){['bookings','accounts','reports'].forEach(i=>$(i).classList.toggle('hidden',i!==x));if(x==='bookings')renderBookings('');if(x==='reports')renderReport();}
function saveBooking(){let k=$('no').value.trim();if(!k)return alert('Enter Booking / Serial No.');let old=db[k]||{};db[k]={...old,booking:{date:$('date').value,event:$('event').value,name:$('name').value,phone:$('phone').value,total:n($('bt').value),advance:n($('ba').value),notes:$('notes').value},account:old.account||{rent:n($('bt').value),advance:n($('ba').value),rate:18,expenses:[]}};save();alert('Saved '+k);renderBookings('');}
function renderBookings(q=''){q=q.toLowerCase();$('list').innerHTML=Object.entries(db).filter(([k,v])=>(k+' '+(v.booking?.name||'')+' '+(v.booking?.phone||'')).toLowerCase().includes(q)).map(([k,v])=>`<div class=item onclick="tab('accounts');$('find').value='${k}';openAccount('${k}')"><b>${k}</b> — ${v.booking?.event||''}<br><span class=muted>${v.booking?.name||''} • ${v.booking?.phone||''}</span></div>`).join('')||'<span class=muted>No bookings yet.</span>'}
function openAccount(k){if(!db[k]){$('acct').innerHTML='';return}cur=k;let b=db[k].booking||{},a=db[k].account||{};a.expenses=a.expenses||[];$('acct').innerHTML=`<div class=card><b>${k}</b><div class=muted>${b.event||''} • ${b.name||''} • ${b.phone||''}</div>
<h2>INCOME / COLLECTION</h2>${field('Rent total','rent',a.rent??b.total)}${field('Advance (-)','advance',a.advance??b.advance)}${out('Rent bal.','rb')}${field('Water','water',a.water)}${field('Power Units','units',a.units)}${field('Power Rate','rate',a.rate??18)}${out('Power Amount','power')}${field('Decoration','decoration',a.decoration)}${field('Lighting','lighting',a.lighting)}${out('TOTAL','income',1)}
<h2>EXPENSES</h2><div id=ex>${a.expenses.map((e,i)=>expense(e,i)).join('')}</div><button class=secondary onclick="addEx()">＋ Add Expense</button>${out('EXP Total','exp',1)}${out('TOTAL - EXP','final',1)}
<button onclick="saveAccount()">Save Account</button></div>`;calc();}
function field(label,id,val){return `<div class=row><span>${label}</span><input id=a_${id} type=number value="${val||0}" oninput="calc()"></div>`}function out(label,id,big){return `<div class="row total"><span>${label}</span><span id=o_${id}>₹0</span></div>`}
function expense(e,i){return `<div class=row><input class=exn value="${(e.name||'').replaceAll('"','&quot;')}"><input class=exa type=number value="${e.amount||0}" oninput="calc()"></div>`}
function addEx(){$('ex').insertAdjacentHTML('beforeend',expense({name:'',amount:0},0));}
function calc(){if(!cur)return;let a=id=>n($('a_'+id)?.value),rb=a('rent')-a('advance'),p=a('units')*a('rate'),inc=rb+a('water')+p+a('decoration')+a('lighting'),ex=[...document.querySelectorAll('.exa')].reduce((s,x)=>s+n(x.value),0);['rb','power','income','exp','final'].forEach((id,i)=>$('o_'+id).textContent=money([rb,p,inc,ex,inc-ex][i]));}
function saveAccount(){let a=id=>n($('a_'+id)?.value),ex=[...document.querySelectorAll('#ex .row')].map(r=>({name:r.querySelector('.exn').value,amount:n(r.querySelector('.exa').value)}));db[cur].account={rent:a('rent'),advance:a('advance'),water:a('water'),units:a('units'),rate:a('rate'),decoration:a('decoration'),lighting:a('lighting'),expenses:ex};save();alert('Account saved for '+cur);}
function renderReport(){let keys=Object.keys(db),inc=0,ex=0;keys.forEach(k=>{let a=db[k].account||{};let rb=n(a.rent)-n(a.advance),p=n(a.units)*n(a.rate||18);inc+=rb+n(a.water)+p+n(a.decoration)+n(a.lighting);ex+=(a.expenses||[]).reduce((s,e)=>s+n(e.amount),0)});$('report').innerHTML=`<div class=row><span>Bookings</span><b>${keys.length}</b></div><div class=row><span>Income</span><b>${money(inc)}</b></div><div class=row><span>Expenses</span><b>${money(ex)}</b></div><div class="row total"><span>Balance</span><b>${money(inc-ex)}</b></div>`}
renderBookings();
</script></body></html>
